name: Test wykorzystania matrix

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.14', '3.9', '3.1']
        include:
          - os: ubuntu-latest
            python-version: '3.8'
        exclude:
          - os: windows-latest
            python-version: '3.9'
    steps:
      - uses: actions/checkout@v7
      - name: Ustawienie wersji Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pokaż informacje o środowisku
        run: |
          python --version
          uname -a || systeminfo
      - name: Uruchomienie testów
        run: echo "Uruchamiam testy na Pythonie ${{ matrix.python-version }} na systemie ${{ matrix.os }}"